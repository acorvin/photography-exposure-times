<style>
  /* Let the block grow and shrink with the piece instead of the Fluid Engine grid. */
  .fluid-engine:has(#photography-exposure-times) { display: block !important; height: auto !important; }
  .fluid-engine:has(#photography-exposure-times) > .fe-block { grid-area: auto !important; height: auto !important; }
</style>
<iframe id="photography-exposure-times" src="https://acorvin.github.io/photography-exposure-times/" title="Holding Still: two centuries of exposure times" loading="lazy" style="width:100%;height:1400px;border:0;display:block;background:#121212"></iframe>
<script>
window.addEventListener('message', function (e) {
  if (e.data && e.data.type === 'photography-exposure-times-height') {
    document.getElementById('photography-exposure-times').style.height = e.data.height + 'px';
  }
});
</script>
